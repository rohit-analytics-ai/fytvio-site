<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://api.fytvio.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Verify your email — Fytvio</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f9fc;color:#11182e;
      min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:430px;background:#fff;border:1px solid #e6edf3;border-radius:24px;
      box-shadow:0 18px 60px rgba(24,93,150,.10);padding:38px 30px;text-align:center}
    .logo{font-size:26px;font-weight:900;letter-spacing:-1px;margin-bottom:28px}.logo span{color:#25bff1}
    .icon{width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      margin:0 auto 20px;font-size:29px;font-weight:900;background:rgba(33,143,240,.11);color:#218ff0}
    h1{font-size:24px;letter-spacing:-.4px;margin-bottom:9px}
    p{color:#68758b;font-size:14px;line-height:1.55;margin-bottom:0}
    .loading{color:#748197;font-size:13px;padding:16px 0}.state{display:none}
  </style>
</head>
<body>
<main class="card">
  <div class="logo">fyt<span>vio</span></div>
  <div class="loading" id="loading">Verifying your email…</div>
  <section class="state" id="success"><div class="icon">✓</div><h1>Email verified</h1><p>You’re all set. Return to Fytvio and continue.</p></section>
  <section class="state" id="invalid"><div class="icon">×</div><h1>Link unavailable</h1><p id="invalid-copy">This verification link is invalid, expired, or has already been used. Request a new one from Fytvio.</p></section>
</main>
<script>
(function(){
  var API_ORIGIN='https://api.fytvio.com';
  var fragment=new URLSearchParams((window.location.hash||'').replace(/^#/,''));
  var hashToken=fragment.get('token')||'';
  // Legacy support if this branded page is ever reached with an old query URL.
  var queryToken=new URLSearchParams(window.location.search).get('token')||'';
  var token=hashToken||queryToken;
  try{history.replaceState({},document.title,window.location.pathname);}catch(e){}

  function show(id){
    document.getElementById('loading').style.display='none';
    document.getElementById(id).style.display='block';
  }
  if(!/^[a-f0-9]{64}$/i.test(token)){show('invalid');return;}

  fetch(API_ORIGIN+'/auth/verify-email',{
    method:'POST',
    headers:{'Content-Type':'application/json','Cache-Control':'no-store'},
    body:JSON.stringify({token:token}),
    cache:'no-store',
    credentials:'omit',
    referrerPolicy:'no-referrer'
  }).then(function(r){
    return r.json().catch(function(){return {};}).then(function(data){return {ok:r.ok,data:data};});
  }).then(function(res){
    token='';
    if(res.ok){show('success');return;}
    show('invalid');
  }).catch(function(){
    token='';
    document.getElementById('invalid-copy').textContent='We could not verify your email. Check your connection and open the email link again.';
    show('invalid');
  });
})();
</script>
</body>
</html>
